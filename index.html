<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Think before you code | Ice Stack</title>
  <meta name="description"
    content="Open-source knowledge for better engineering decisions. Work real software problems from context and trade-offs to a decision you can verify, in English and Khmer." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
  <meta property="og:site_name" content="Ice Stack" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/svg+xml" href="/logo/logo-symbol.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Khmer:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans Khmer', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            docus: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            dark: {
              bg: '#09090b',
              surface: '#121215',
              card: '#18181b',
              border: '#27272a',
              muted: '#71717a'
            }
          }
        },
      },
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
      color-scheme: light;
    }

    html.dark {
      color-scheme: dark;
    }

    /* Firefox only: in Chrome 121+ a global scrollbar-width would override the ::-webkit sizes below. */
    @supports not selector(::-webkit-scrollbar) {
      * {
        scrollbar-width: thin;
        scrollbar-color: #d4d4d8 transparent;
      }

      .dark * {
        scrollbar-color: #27272a transparent;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d4d4d8;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a1a1aa;
    }

    .dark ::-webkit-scrollbar-track {
      background: transparent;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #27272a;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* Hairline track for long side panels (Chrome-family only). */
    .scrollbar-slim::-webkit-scrollbar {
      width: 3px;
      height: 3px;
    }

    .scrollbar-slim::-webkit-scrollbar-thumb {
      background: #e4e4e7;
    }

    .scrollbar-slim:hover::-webkit-scrollbar-thumb {
      background: #d4d4d8;
    }

    .dark .scrollbar-slim::-webkit-scrollbar-thumb {
      background: #232326;
    }

    .dark .scrollbar-slim:hover::-webkit-scrollbar-thumb {
      background: #3f3f46;
    }
  </style>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body
  class="bg-white text-zinc-900 dark:bg-[#09090b] dark:text-zinc-100 antialiased selection:bg-emerald-500/25 transition-colors duration-200">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
